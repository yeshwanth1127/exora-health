name: Staff workspace
on:
  pull_request:
    paths: ['HMS_NEW/**', '.github/workflows/staff-workspace.yml']
  push:
    branches: [main]
    paths: ['HMS_NEW/**', '.github/workflows/staff-workspace.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HMS_NEW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm staff:test
      - run: pnpm staff:build
      - run: pnpm website:test
      - run: pnpm website:build
      - run: pnpm --filter @hms/platform-web test
      - run: pnpm platform:build
        env:
          NEXT_PUBLIC_SITE_ORIGIN: https://health.exora.solutions
          NEXT_PUBLIC_SEARCH_INDEXING: 'true'
      - run: pnpm --filter @hms/platform-web seo:check
      - name: Verify platform provisioning contracts
        run: |
          pnpm pg:start
          trap 'pnpm pg:stop' EXIT
          pnpm exec vitest run apps/control-api/src/onboarding-flow.test.ts apps/control-api/src/platform-pages.test.ts apps/control-api/src/workspace-bootstrap.test.ts apps/control-api/src/provisioner-input.test.ts
