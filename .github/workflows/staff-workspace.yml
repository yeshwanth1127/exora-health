name: Staff workspace
on:
  pull_request:
    paths: ['HMS_NEW/**', '.github/workflows/staff-workspace.yml']
  push:
    branches: [main]
    paths: ['HMS_NEW/**', '.github/workflows/staff-workspace.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HMS_NEW
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm staff:test
      - run: pnpm staff:build
