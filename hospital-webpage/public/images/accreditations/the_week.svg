<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" fill="none">
  <!-- The Week Classic Masthead -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="180" height="48" rx="4" stroke="#222222" stroke-width="2" fill="none"/>
    <text x="90" y="27" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-weight="900" fill="#222222" letter-spacing="3">THE WEEK</text>
    <line x1="15" y1="33" x2="165" y2="33" stroke="#222222" stroke-width="1"/>
    <text x="90" y="43" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="7.5" font-weight="800" fill="#444444" letter-spacing="1.5">BEST HOSPITALS SURVEY</text>
  </g>
</svg>
