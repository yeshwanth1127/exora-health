name: exora-${TENANT_SLUG:-demo}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: hms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-postgres}
    volumes:
      - tenant_pgdata:/var/lib/postgresql
    networks:
      - tenant_private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hms"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_HMS_DEV_LOGIN: ${VITE_HMS_DEV_LOGIN:-true}
        VITE_OIDC_AUTHORITY: ${OIDC_ISSUER:-}
        VITE_OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
        VITE_OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
        VITE_OIDC_SCOPE: ${OIDC_SCOPE:-openid profile email}
        VITE_HMS_DEFAULT_SUBJECT: ${VITE_HMS_DEFAULT_SUBJECT:-admin}
    image: ${HMS_IMAGE:-exora/hms:local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      HOST: 0.0.0.0
      PORT: 3000
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      AUTH_MODE: ${AUTH_MODE:-dev}
      VITE_HMS_DEV_LOGIN: ${VITE_HMS_DEV_LOGIN:-true}
      ADMIN_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-demo-postgres}@db:5432/hms?sslmode=disable
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-local-demo-postgres}@db:5432/hms?sslmode=disable
      APP_DATABASE_URL: postgres://hms_app:${HMS_APP_PASSWORD:-local-demo-app}@db:5432/hms?sslmode=disable
      HMS_APP_PASSWORD: ${HMS_APP_PASSWORD:-local-demo-app}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:-local-container-secret-change-before-sharing}
      TENANT_BOOTSTRAP: ${TENANT_BOOTSTRAP:-demo}
      TENANT_SLUG: ${TENANT_SLUG:-demo}
      TENANT_PLAN: ${TENANT_PLAN:-connect}
      VOICE_REQUESTED: ${VOICE_REQUESTED:-0}
      VOICE_SERVICE_KEY: ${VOICE_SERVICE_KEY:-}
      VOICE_SIGNING_SECRET: ${VOICE_SIGNING_SECRET:-}
      VOICE_SERVICE_ACCOUNT_ID: ${VOICE_SERVICE_ACCOUNT_ID:-}
      VOICE_NOTICE_VERSION: ${VOICE_NOTICE_VERSION:-2026-10-14}
      VOICE_SESSION_SECONDS: ${VOICE_SESSION_SECONDS:-900}
      VOICE_RECORDING_NOTICE: ${VOICE_RECORDING_NOTICE:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      SARVAM_ORG_ID: ${SARVAM_ORG_ID:-}
      SARVAM_WORKSPACE_ID: ${SARVAM_WORKSPACE_ID:-}
      SARVAM_APP_ID: ${SARVAM_APP_ID:-}
      SARVAM_APP_VERSION: ${SARVAM_APP_VERSION:-}
      SARVAM_AGENT_NAME: ${SARVAM_AGENT_NAME:-}
      SARVAM_PHONE_NUMBER: ${SARVAM_PHONE_NUMBER:-}
      PUBLIC_TENANT_ID: ${PUBLIC_TENANT_ID:-01920000-0000-7000-8000-000000000001}
      BOOTSTRAP_TENANT_ID: ${BOOTSTRAP_TENANT_ID:-01920000-0000-7000-8000-000000000001}
      BOOTSTRAP_TENANT_NAME: ${BOOTSTRAP_TENANT_NAME:-Demo Health}
      BOOTSTRAP_OWNER_NAME: ${BOOTSTRAP_OWNER_NAME:-Workspace Administrator}
      BOOTSTRAP_OWNER_EMAIL: ${BOOTSTRAP_OWNER_EMAIL:-admin@example.test}
      BOOTSTRAP_FACILITY_NAME: ${BOOTSTRAP_FACILITY_NAME:-Main Clinic}
      BOOTSTRAP_FACILITY_ID: ${BOOTSTRAP_FACILITY_ID:-}
      MANAGED_BOOKING_STAFF_ID: ${MANAGED_BOOKING_STAFF_ID:-}
      BOOTSTRAP_CITY: ${BOOTSTRAP_CITY:-Bengaluru}
      BOOTSTRAP_FACILITY_TYPE: ${BOOTSTRAP_FACILITY_TYPE:-clinic}
      BOOTSTRAP_TIMEZONE: ${BOOTSTRAP_TIMEZONE:-Asia/Kolkata}
      SERVE_WEB_ASSETS: "1"
      WEBSITE_TEMPLATE: ${WEBSITE_TEMPLATE:-standard}
      WEBSITE_CONTENT_JSON: ${WEBSITE_CONTENT_JSON:-}
      COMMS_STORAGE_PATH: /data/comms
      INTEGRATIONS_PUBLIC_ORIGIN: ${INTEGRATIONS_PUBLIC_ORIGIN:-}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY:-}
      GOOGLE_BUSINESS_CLIENT_ID: ${GOOGLE_BUSINESS_CLIENT_ID:-}
      GOOGLE_BUSINESS_CLIENT_SECRET: ${GOOGLE_BUSINESS_CLIENT_SECRET:-}
      WA_APP_ID: ${WA_APP_ID:-}
      WA_APP_SECRET: ${WA_APP_SECRET:-}
      META_SIGNUP_CONFIG_ID: ${META_SIGNUP_CONFIG_ID:-}
      WA_GRAPH_VERSION: ${WA_GRAPH_VERSION:-}
      WA_VERIFY_TOKEN: ${WA_VERIFY_TOKEN:-}
      WA_MANAGED_SENDING_ENABLED: ${WA_MANAGED_SENDING_ENABLED:-false}
      WA_ESTIMATED_RATE_MINOR: ${WA_ESTIMATED_RATE_MINOR:-100}
      UMAMI_ORIGIN: ${UMAMI_ORIGIN:-}
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      UMAMI_TEAM_ID: ${UMAMI_TEAM_ID:-}
      MANAGED_POSTHOG_ORIGIN: ${MANAGED_POSTHOG_ORIGIN:-}
      MANAGED_POSTHOG_KEY: ${MANAGED_POSTHOG_KEY:-}
      PUBLIC_BOOKING_ENABLED: ${PUBLIC_BOOKING_ENABLED:-false}
      PUBLIC_BOOKING_SIGNING_SECRET: ${PUBLIC_BOOKING_SIGNING_SECRET:-}
      PUBLIC_BOOKING_SITES_JSON: ${PUBLIC_BOOKING_SITES_JSON:-[]}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      TELE_PATIENT_LINK_BASE: ${TELE_PATIENT_LINK_BASE:-http://127.0.0.1:8080/staff/video-consult}
    ports:
      - "127.0.0.1:${TENANT_PORT:-8080}:3000"
    volumes:
      - tenant_private_data:/data
    networks:
      - tenant_private
      - tenant_ingress

networks:
  tenant_private:
    internal: true
  tenant_ingress:

volumes:
  tenant_pgdata:
  tenant_private_data:
