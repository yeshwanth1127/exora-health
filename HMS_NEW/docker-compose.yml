# Local PostgreSQL 18 for machines with Docker. Same port and credentials as `pnpm pg:start`,
# so scripts and tests work with either. Use one or the other, not both.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      # The postgres:18 image keeps data under /var/lib/postgresql/18/..., so mount the parent.
      - hms_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  hms_pgdata:
