worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    sendfile on;
    keepalive_timeout 15s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 15s;
    client_max_body_size 1k;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    # Only the private Docker peer can reach this unpublished HTTP service.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=20r/s;
    limit_req_zone $server_name zone=site_total:1m rate=500r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    limit_req_status 429;
    limit_conn_status 429;
    map $uri $cache_control {
        default "no-cache";
        ~^/_next/static/ "public, max-age=31536000, immutable";
        ~^/assets/ "public, max-age=604800";
    }
    server {
        listen 8080;
        root /srv;
        index index.html;
        autoindex off;
        limit_req zone=per_ip burst=100 nodelay;
        limit_req zone=site_total burst=250 nodelay;
        limit_conn connections 40;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control $cache_control always;
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        location ~* ^/(quote|onboarding|api|admin|staff|control)([/.]|$) { return 404; }
        location ~ /\. { return 404; }
        location ~* \.(map|env|zip|bak|sql|json|ya?ml|toml)$ { return 404; }
        location /_next/static/ {
            try_files $uri =404;
        }
        location /assets/ {
            try_files $uri =404;
        }
        location / { try_files $uri $uri.html $uri/index.html =404; }
        error_page 404 /404.html;
        location = /404.html { internal; }
    }
}
