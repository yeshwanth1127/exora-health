name: paperwhale-website
services:
  web:
    image: paperwhale-website:${PAPERWHALE_RELEASE:?Set the source commit}
    build:
      context: ../../..
      dockerfile: apps/platform-web/deploy/Dockerfile
      args:
        SOURCE_COMMIT: ${PAPERWHALE_RELEASE}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 150
    mem_limit: 768m
    cpus: 1
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: 1
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks: [website]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  edge:
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.75
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [website]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  website:
volumes:
  caddy_data:
  caddy_config:
