name: capture-website
services:
  web:
    image: nginx:stable-alpine@sha256:c59d1f8b1e0e42da75be973424cd72e23f7f8adfb54e982f4d1cd0216a5a5576
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.75
    volumes:
      - /opt/capture-site/current:/srv:ro
      - /opt/capture-site/config/nginx.conf:/etc/nginx/nginx.conf:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks: [website]
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
  edge:
    image: caddy:2-alpine@sha256:24ec7b05bc532c7bb57f727030c5056e257ff7138b4b50460306819ff79362bd
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 100
    mem_limit: 256m
    cpus: 0.75
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/capture-site/config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [website]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: "2"}
networks:
  website:
volumes:
  caddy_data:
  caddy_config:
