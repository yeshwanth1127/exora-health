# Installed on the public server (10.0.0.5). TLS directives are maintained by Certbot.
upstream avocado_backend { server 10.0.0.1:18004; keepalive 16; }
upstream avocado_webpage { server 10.0.0.1:15567; keepalive 16; }
upstream avocado_voice { server 10.0.0.1:18765; keepalive 8; }

server {
    server_name avocado.exora.solutions;
    server_tokens off;
    client_max_body_size 25M;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /api/ {
        proxy_pass http://avocado_backend;
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs { proxy_pass http://avocado_backend; include proxy_params; }
    location /openapi.json { proxy_pass http://avocado_backend; include proxy_params; }
    location /whatsapp-assets { proxy_pass http://avocado_backend; include proxy_params; }

    location = /talk { return 301 /talk/; }
    location /talk/ {
        proxy_pass http://avocado_voice/;
        include proxy_params;
    }
    location /voice-static/ {
        rewrite ^/voice-static/(.*)$ /static/$1 break;
        proxy_pass http://avocado_voice;
        include proxy_params;
    }
    location /voice-api/ {
        rewrite ^/voice-api/(.*)$ /api/$1 break;
        proxy_pass http://avocado_voice;
        include proxy_params;
        proxy_read_timeout 120s;
    }
    location /ws/voice {
        proxy_pass http://avocado_voice;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://avocado_webpage;
        include proxy_params;
    }

    access_log /var/log/nginx/avocado_access.log;
    error_log /var/log/nginx/avocado_error.log;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/avocado.exora.solutions/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avocado.exora.solutions/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    listen [::]:80;
    server_name avocado.exora.solutions;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
